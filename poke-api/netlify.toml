# netlify.toml
# Put this file in your project root (same level as package.json)

[build]
  # Build command for Vite
  command = "npm run build"
  # Directory to publish (Vite outputs to 'dist')
  publish = "dist"
  # Functions directory (this is crucial!)
  functions = "netlify/functions"

[functions]
  # Function settings
  node_bundler = "esbuild"
  
# Make sure functions can handle CORS
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

[build.environment]
  # Node.js version
  NODE_VERSION = "18"

# Function settings
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"